# Versión de la app, configurable por variable de entorno
app.version=${APP_VERSION:unknown}
quarkus.http.auth.form.http-only-cookie=false
quarkus.mongodb.connection-string = mongodb://localhost:27017
quarkus.mongodb.database = example-db
quarkus.banner.path=banner.txt
quarkus.http.cors=true
%dev.quarkus.http.cors.origins=/.*/
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# jwk authentication
smallrye.jwt.verify.key.location=secret.jwk
smallrye.jwt.verify.key-format=JWK
smallrye.jwt.verify.algorithm=HS256

# Cache configuration
quarkus.cache.caffeine."program".initial-capacity=10
quarkus.cache.caffeine."program".maximum-size=50
quarkus.cache.caffeine."program".expire-after-access=60S
quarkus.cache.caffeine."program".expire-after-write=30M

quarkus.cache.caffeine."channel".initial-capacity=10
quarkus.cache.caffeine."channel".maximum-size=100
quarkus.cache.caffeine."channel".expire-after-access=60S
quarkus.cache.caffeine."channel".expire-after-write=30M

flow-api/mp-rest/url=https://qvideo.com
auth-sdk-api/mp-rest/url=https://authsdk.qvideo.com
auth-flow-api/mp-rest/url=https://auth.qvideo.com

# TokenService configuration
flow.access.token=your-access-token-value-here
flow.device.token=your-device-token-value-here
flow.cas.id=your-cas-identifier-here
flow.mac=device-mac-address-here
flow.device.uuid=device-unique-identifier-here
flow.device.app.version=flow-app-version-here
flow.account=account-number-here
